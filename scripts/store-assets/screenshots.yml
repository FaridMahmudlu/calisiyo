appId: tr.com.planliyo.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Tercih senin|Giriş yap|Tekrar hoş geldin'
    timeout: 120000
- tapOn:
    text: 'Yalnızca zorunlu'
    optional: true
- tapOn:
    text: 'Giriş yap'
    optional: true
- extendedWaitUntil:
    visible: 'ornek@email.com'
    timeout: 60000
- tapOn: 'ornek@email.com'
- inputText: ${REVIEW_EMAIL}
- pressKey: Enter
- tapOn:
    text: 'Şifreyi göster'
    optional: true
- tapOn:
    below: 'Şifre'
- inputText: ${REVIEW_PASSWORD}
- pressKey: Enter
- tapOn:
    text: 'Giriş Yap'
    optional: true
- tapOn:
    text: 'Yalnızca zorunlu'
    optional: true
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'navigation-program'
    timeout: 90000
- tapOn:
    id: 'navigation-program'
- waitForAnimationToEnd
- tapOn:
    id: 'navigation-index'
- extendedWaitUntil:
    visible: 'Merhaba, Deniz!.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: store-01-bugun
- tapOn:
    id: 'navigation-program'
- waitForAnimationToEnd
- takeScreenshot: store-02-program
- tapOn:
    id: 'navigation-kronometre'
- waitForAnimationToEnd
- takeScreenshot: store-03-kronometre
- tapOn:
    id: 'navigation-menu'
- waitForAnimationToEnd
- tapOn: 'Haftalık Program'
- extendedWaitUntil:
    visible: 'Görüntülenen hafta'
    timeout: 30000
- extendedWaitUntil:
    visible: 'Problemler ve soru çözümü'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: store-04-haftalik
- openLink: 'planliyo://konu-takibi'
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: 'Konu Takibi'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: store-05-konu
- openLink: 'planliyo://deneme-analizi'
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
