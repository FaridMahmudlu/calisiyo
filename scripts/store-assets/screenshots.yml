appId: tr.com.planliyo.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Tercih senin|Giriş yap|Tekrar hoş geldin'
    timeout: 120000
- tapOn:
    text: 'Yalnızca zorunlu'
    optional: true
- tapOn:
    text: 'Giriş yap'
    optional: true
- extendedWaitUntil:
    visible: 'ornek@email.com'
    timeout: 60000
- tapOn: 'ornek@email.com'
- inputText: ${REVIEW_EMAIL}
- pressKey: Enter
- tapOn:
    text: 'Şifreyi göster'
    optional: true
- tapOn:
    below: 'Şifre'
- inputText: ${REVIEW_PASSWORD}
- pressKey: Enter
- tapOn:
    text: 'Giriş Yap'
    optional: true
- tapOn:
    text: 'Yalnızca zorunlu'
    optional: true
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'navigation-program'
    timeout: 90000
- takeScreenshot: store-01-bugun
- tapOn:
    id: 'navigation-program'
- waitForAnimationToEnd
- takeScreenshot: store-02-program
- tapOn:
    id: 'navigation-kronometre'
- waitForAnimationToEnd
- takeScreenshot: store-03-kronometre
- tapOn:
    id: 'navigation-menu'
- waitForAnimationToEnd
- takeScreenshot: store-04-menu
