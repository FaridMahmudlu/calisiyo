name: Planliyo iOS store screenshots
on:
  push:
    branches: ['release/ios-store-assets-20261105']
    paths: ['.github/workflows/ios-store-assets.yml', 'scripts/store-assets/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install verified Maestro and simulator application
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          echo "a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-install"
          curl --fail --location --retry 3 https://expo.dev/artifacts/eas/sJruFOLuJua1MQIhOAj_9wig9ZFRNo3eatr1Ipe5QCQ.tar.gz -o "$RUNNER_TEMP/planliyo-simulator.tar.gz"
          mkdir -p "$RUNNER_TEMP/planliyo-app"
          tar -xzf "$RUNNER_TEMP/planliyo-simulator.tar.gz" -C "$RUNNER_TEMP/planliyo-app"
          python3 scripts/store-assets/prepare-simulator.py '${{ matrix.device }}'
          # Also preserve the primary Apple schema so Windows does not need a local SDK.
          curl --fail --location --retry 2 --max-time 45 https://developer.apple.com/sample-code/app-store-connect/app-store-connect-openapi-specification.zip -o "$RUNNER_TEMP/apple-openapi.zip" || true
          mkdir -p store-screenshots
          if [ -f "$RUNNER_TEMP/apple-openapi.zip" ]; then cp "$RUNNER_TEMP/apple-openapi.zip" store-screenshots/; fi
      - name: Capture the actual signed-in application
        shell: bash
        env:
          REVIEW_EMAIL: ${{ secrets.PLANLIYO_STORE_REVIEW_EMAIL }}
          REVIEW_PASSWORD: ${{ secrets.PLANLIYO_STORE_REVIEW_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$REVIEW_EMAIL" && test -n "$REVIEW_PASSWORD"
          export MAESTRO_CLI_NO_ANALYTICS=1
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          MAESTRO=$(find "$RUNNER_TEMP/maestro-install" -type f -path '*/bin/maestro' | head -1)
          "$MAESTRO" --device "$PLANLIYO_SIMULATOR_ID" test --test-output-dir "$RUNNER_TEMP/maestro-output" -e REVIEW_EMAIL="$REVIEW_EMAIL" -e REVIEW_PASSWORD="$REVIEW_PASSWORD" scripts/store-assets/screenshots.yml
          mkdir -p store-screenshots
          find "$RUNNER_TEMP/maestro-output" -type f -name 'store-*.png' -exec cp {} store-screenshots/ \;
          test "$(find store-screenshots -name 'store-*.png' | wc -l | tr -d ' ')" -eq 10
          if [ -f "$RUNNER_TEMP/apple-openapi.zip" ]; then cp "$RUNNER_TEMP/apple-openapi.zip" store-screenshots/; fi
      - name: Capture a fresh launch for diagnosis if automation fails
        if: failure()
        shell: bash
        run: |
          # Restart discards any transient form input before capturing diagnostics.
          mkdir -p store-screenshots
          xcrun simctl terminate "$PLANLIYO_SIMULATOR_ID" tr.com.planliyo.app || true
          xcrun simctl launch "$PLANLIYO_SIMULATOR_ID" tr.com.planliyo.app || true
          sleep 12
          xcrun simctl io "$PLANLIYO_SIMULATOR_ID" screenshot store-screenshots/startup-diagnostic.png || true
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          MAESTRO=$(find "$RUNNER_TEMP/maestro-install" -type f -path '*/bin/maestro' | head -1)
          "$MAESTRO" --device "$PLANLIYO_SIMULATOR_ID" hierarchy > store-screenshots/startup-hierarchy.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: planliyo-ios-store-${{ matrix.device }}
          path: store-screenshots/
          if-no-files-found: error
          retention-days: 7
